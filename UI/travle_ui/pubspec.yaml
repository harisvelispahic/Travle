name: travle_ui
description: Shared design system for the Travle apps — tokens, theme, and widgets.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Shared client logic (pure Dart utils/models). The design system consumes
  # core helpers (e.g. ImageCodec) so all non-widget logic has a single home.
  travle_core:
    path: ../travle_core

  # Maps (destination picker + read-only destination/itinerary views). flutter_map
  # is the Flutter-native tile-map (the Leaflet equivalent) — pure Dart, runs on
  # Android + Windows with no native config; latlong2 supplies its LatLng type.
  # Both are kept behind travle_ui's map widgets so screens use plain doubles.
  flutter_map: ^8.2.1
  latlong2: ^0.9.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
