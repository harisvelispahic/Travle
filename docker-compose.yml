# Travle — orchestration. Run from the repo root.
#
#   docker compose up --build
#       → everything: SQL Server, RabbitMQ, worker, API (the canonical / grader run).
#
#   docker compose up travle-sqlserver travle-rabbitmq travle-worker
#       → infra + worker only; leave the API out and run/debug it locally in VS.
#         (A locally-run API reads appsettings.Development.json → localhost,1435 / localhost:5672.)
#
# All values come from `.env` (copy `.env.example` → `.env`). Nothing secret is hardcoded here.

services:
  travle-sqlserver:
    # Explicitly pinned CU tag (course §3.2 — no bare `latest` on key services).
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: travle-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${SQLSERVER_HOST_PORT}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - travle-network
    healthcheck:
      # Try the v18 tools (present on this image) first, then the older v17 path as a fallback.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  travle-rabbitmq:
    image: rabbitmq:3.13-management
    container_name: travle-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_HOST_PORT}:5672"     # AMQP
      - "${RABBITMQ_MGMT_PORT}:15672"    # management UI (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - travle-network
    healthcheck:
      # `ping` only proves the Erlang node answers — it succeeds ~10 s before the broker finishes
      # booting and opens the AMQP listener, so compose called RabbitMQ healthy while port 5672 was
      # still refusing connections and the worker started into a retry storm.
      # `check_port_connectivity` probes the listeners themselves, which is what a client needs.
      #
      # Run it through `gosu rabbitmq`, exactly as the image's own entrypoint starts the broker. A
      # healthcheck does NOT go through the entrypoint — Docker executes it directly, as the image's
      # default user, which here is root. rabbitmq-diagnostics is an Erlang CLI tool, so when no
      # cookie exists yet it *creates* /var/lib/rabbitmq/.erlang.cookie as the user running it. On a
      # slow or loaded host the broker has not written that cookie by the time the first check fires
      # (5 s in), root wins the race, and the broker then dies with
      # "Error when reading /var/lib/rabbitmq/.erlang.cookie: eacces" on every clean start.
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

  travle-worker:
    build:
      context: ./Backend
      dockerfile: Travle.Worker/Dockerfile
    container_name: travle-worker
    environment:
      - DOTNET_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - RabbitMq__Host=${RABBITMQ_HOST}
      - RabbitMq__Port=${RABBITMQ_PORT}
      - RabbitMq__Username=${RABBITMQ_USERNAME}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
      - Smtp__Host=${SMTP_HOST}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME}
      - Smtp__Password=${SMTP_PASSWORD}
      - Smtp__From=${SMTP_FROM:-no-reply@travle.com}
      - Smtp__FromName=${SMTP_FROM_NAME:-Travle}
      - Smtp__UseStartTls=${SMTP_USE_STARTTLS:-true}
    depends_on:
      travle-sqlserver:
        condition: service_healthy
      travle-rabbitmq:
        condition: service_healthy
    networks:
      - travle-network

  travle-api:
    build:
      context: ./Backend
      dockerfile: Travle.WebAPI/Dockerfile
    container_name: travle-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - JwtToken__SecretKey=${JWT_SECRET_KEY}
      - JwtToken__Issuer=${JWT_ISSUER}
      - JwtToken__Audience=${JWT_AUDIENCE}
      - JwtToken__DurationInMinutes=${JWT_DURATION_MINUTES}
      - JwtToken__RefreshTokenDays=${JWT_REFRESH_TOKEN_DAYS:-7}
      - RabbitMq__Host=${RABBITMQ_HOST}
      - RabbitMq__Port=${RABBITMQ_PORT}
      - RabbitMq__Username=${RABBITMQ_USERNAME}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
      # Payments (Stripe test mode). The webhook secret comes from `stripe listen` / the dashboard endpoint.
      - Payments__StripeSecretKey=${STRIPE_SECRET_KEY}
      - Payments__StripeWebhookSecret=${STRIPE_WEBHOOK_SECRET}
      - Payments__StripePublishableKey=${STRIPE_PUBLISHABLE_KEY}
      - Payments__PlatformFeePercentage=${PLATFORM_FEE_PERCENTAGE}
      # Platform fallback zone for displaying tour event times (see docs/time-and-timezones.md).
      - Time__PlatformTimeZoneId=${PLATFORM_TIMEZONE:-Europe/Sarajevo}
      # How far ahead the in-process sweep raises the pre-tour reminder. 24 h is the spec; widen it for
      # a demo, since seeded departures rarely sit exactly 24 h away at review time.
      - BookingReminder__WindowHours=${BOOKING_REMINDER_WINDOW_HOURS:-24}
    ports:
      - "${API_HOST_PORT}:5121"
    depends_on:
      travle-sqlserver:
        condition: service_healthy
      travle-rabbitmq:
        condition: service_healthy
    networks:
      - travle-network

volumes:
  sqlserver_data:
  rabbitmq_data:

networks:
  travle-network:
    driver: bridge
